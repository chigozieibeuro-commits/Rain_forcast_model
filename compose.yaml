services:
  app:
    build: .
    container_name: rain_api
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:17
    container_name: rain_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: weather
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: